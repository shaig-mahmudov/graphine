name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p benchmark-core -- validate

  java:
    name: java-${{ matrix.os }}-jdk${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, java: '17'}
          - {os: ubuntu-latest, java: '21'}
          - {os: windows-latest, java: '21'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -q -f analyzer-jdt/pom.xml test
      - run: mvn -q -f analyzer-jdt/pom.xml package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-${{ matrix.os }}-jdk${{ matrix.java }}
          path: analyzer-jdt/**/target/surefire-reports/**
          if-no-files-found: ignore

  e2e:
    name: e2e-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'analyzer-jdt/pom.xml') }}
      - name: Linux E2E
        if: runner.os == 'Linux'
        run: |
          bash scripts/test-phase2-e2e.sh
          bash scripts/test-phase3-e2e.sh
          bash scripts/test-rust-e2e.sh
      - name: Windows E2E
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-phase2-e2e.ps1
          ./scripts/test-phase3-e2e.ps1
          ./scripts/test-rust-e2e.ps1

  accuracy:
    name: graph-accuracy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: accuracy-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'analyzer-jdt/pom.xml') }}
      - run: bash scripts/evaluate-java-accuracy.sh target/accuracy-reports
      - run: bash scripts/evaluate-spring-accuracy.sh target/accuracy-reports
      - run: bash scripts/evaluate-rust-accuracy.sh target/accuracy-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-accuracy
          path: target/accuracy-reports/*.json
          if-no-files-found: error

  package:
    name: package-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Linux package and doctor smoke
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/release-dist/graphine
          touch target/release-dist/graphine/stale-from-previous-package
          bash scripts/package-release.sh target/release-dist
          test ! -e target/release-dist/graphine/stale-from-previous-package
          ! tar -tzf target/release-dist/graphine-linux-x86_64.tar.gz | grep -q stale-from-previous-package
          target/release-dist/graphine/graphine --data-dir target/package-doctor doctor
      - name: Windows package and doctor smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release-dist/graphine | Out-Null
          Set-Content target/release-dist/graphine/stale-from-previous-package stale
          ./scripts/package-release.ps1 target/release-dist
          if (Test-Path target/release-dist/graphine/stale-from-previous-package) { throw "stale package staging file survived" }
          if ((tar -tf target/release-dist/graphine-windows-x86_64.zip) -match "stale-from-previous-package") { throw "stale package staging file was archived" }
          ./target/release-dist/graphine/graphine.exe --data-dir target/package-doctor doctor
      - uses: actions/upload-artifact@v4
        with:
          name: graphine-${{ runner.os }}
          path: |
            target/release-dist/*.zip
            target/release-dist/*.tar.gz
            target/release-dist/SHA256SUMS

  release:
    name: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: graphine-*
          path: release-downloads
      - name: Assemble release assets
        run: |
          mkdir release-assets
          find release-downloads -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp '{}' release-assets/ \;
          (cd release-assets && sha256sum *.zip *.tar.gz > SHA256SUMS)
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
